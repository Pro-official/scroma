<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Chrome Browser Frame -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Browser window -->
  <rect x="0" y="0" width="1200" height="800" rx="8" fill="#f5f5f5" filter="url(#shadow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="68" rx="8" fill="#e0e0e0"/>
  <rect x="0" y="60" width="1200" height="8" fill="#e0e0e0"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="34" r="6" fill="#28c940"/>

  <!-- URL bar -->
  <rect x="100" y="22" width="1000" height="24" rx="12" fill="#fff"/>

  <!-- Content area (transparent for screenshot) -->
  <rect x="0" y="68" width="1200" height="732" fill="transparent" class="content-area"/>
</svg>