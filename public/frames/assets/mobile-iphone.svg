<svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone Frame -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="400" height="800" rx="40" fill="#1a1a1a" filter="url(#shadow)"/>

  <!-- Screen bezel -->
  <rect x="10" y="10" width="380" height="780" rx="35" fill="#000"/>

  <!-- Screen area (transparent for screenshot) -->
  <rect x="20" y="80" width="360" height="640" rx="0" fill="transparent" class="content-area"/>

  <!-- Notch -->
  <rect x="150" y="20" width="100" height="30" rx="15" fill="#1a1a1a"/>

  <!-- Home indicator -->
  <rect x="175" y="760" width="50" height="4" rx="2" fill="#666"/>
</svg>