<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom Shadow Frame -->
  <defs>
    <filter id="bigShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Simple frame with prominent shadow -->
  <rect x="40" y="40" width="1120" height="720" rx="8" fill="#ffffff" filter="url(#bigShadow)"/>

  <!-- Content area (transparent for screenshot) -->
  <rect x="40" y="40" width="1120" height="720" rx="8" fill="transparent" class="content-area"/>
</svg>