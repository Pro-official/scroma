<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom Colored Border Frame -->
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer border with gradient -->
  <rect x="0" y="0" width="1200" height="800" rx="16" fill="url(#borderGradient)" filter="url(#shadow)"/>

  <!-- Inner white area -->
  <rect x="8" y="8" width="1184" height="784" rx="12" fill="#ffffff"/>

  <!-- Content area (transparent for screenshot) -->
  <rect x="8" y="8" width="1184" height="784" rx="12" fill="transparent" class="content-area"/>
</svg>