<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Windows Desktop Window Frame -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window -->
  <rect x="0" y="0" width="1440" height="900" rx="0" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1440" height="32" fill="#0078d4"/>

  <!-- Window controls -->
  <rect x="1340" y="8" width="16" height="16" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="1370" y="12" width="16" height="8" fill="none" stroke="#fff" stroke-width="1"/>
  <line x1="1400" y1="8" x2="1416" y2="24" stroke="#fff" stroke-width="1"/>
  <line x1="1416" y1="8" x2="1400" y2="24" stroke="#fff" stroke-width="1"/>

  <!-- Content area (transparent for screenshot) -->
  <rect x="0" y="32" width="1440" height="868" fill="transparent" class="content-area"/>
</svg>