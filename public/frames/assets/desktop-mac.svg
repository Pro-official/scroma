<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- macOS Desktop Window Frame -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="macGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f6f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6e6e6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect x="0" y="0" width="1440" height="900" rx="12" fill="url(#macGradient)" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1440" height="38" rx="12" fill="#e3e3e3"/>
  <rect x="0" y="30" width="1440" height="8" fill="#e3e3e3"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c940"/>

  <!-- Content area (transparent for screenshot) -->
  <rect x="0" y="38" width="1440" height="862" fill="transparent" class="content-area"/>
</svg>